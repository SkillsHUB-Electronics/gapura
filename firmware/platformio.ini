[platformio]
default_envs = esp32c5

[env]
build_flags =
  -D FW_VERSION=\"0.1.0\"

; Waveshare ESP32-C5 dev board (CH343 USB-UART on UART0). ESP32-C5 needs
; Arduino core 3.x, which only the pioarduino platform ships.
[env:esp32c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; 16 MB flash + PSRAM, matching the Waveshare N16R8 module
board = esp32-c5-devkitc1-n16r4
framework = arduino
monitor_speed = 115200
; 16 MB flash: two 6.4 MB app slots (OTA) + 3.4 MB LittleFS for the dashboard
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
monitor_filters = esp32_exception_decoder
build_flags =
  ${env.build_flags}
  -D CORE_DEBUG_LEVEL=1
lib_deps =
  miguelbalboa/MFRC522@^1.4.11
  bblanchon/ArduinoJson@^7.2.0
  adafruit/Adafruit INA219@^1.2.3
  esp32async/ESPAsyncWebServer@^3.12.1
  esp32async/AsyncTCP@^3.4.0
  h2zero/NimBLE-Arduino@^2.3.0

; Host unit tests for pure code (router, util). Needs gcc/g++ on PATH.
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<router.cpp>
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
