<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 744' width='1000' height='744' font-family='system-ui, -apple-system, Segoe UI, Roboto, sans-serif'><title>Gapura wiring: RDM6300</title><rect width='1000' height='744' fill='#ffffff'/><text x='30' y='38' font-size='22' text-anchor='start' font-weight='bold' fill='#212121'>Gapura wiring · RDM6300</text><text x='30' y='60' font-size='13' text-anchor='start' font-weight='normal' fill='#455a64'>Dashboard → Settings → Card reader: “rdm6300”, then restart.</text><text x='30' y='77' font-size='12' text-anchor='start' font-weight='normal' fill='#78909c' font-style='italic'>Dashboard → Settings → Card reader: pilih “rdm6300”, lalu restart.</text><rect x='690' y='104' width='230' height='186' rx='10' fill='#fff3e0' stroke='#37474f' stroke-width='2'/><text x='805.0' y='126' font-size='15' text-anchor='middle' font-weight='bold' fill='#212121'>RDM6300 module</text><text x='805.0' y='143' font-size='11.5' text-anchor='middle' font-weight='normal' fill='#455a64'>125 kHz EM4100 · 5 V · P1 header</text><circle cx='690' cy='166' r='5' fill='#fff' stroke='#37474f' stroke-width='2'/><text x='704' y='170.5' font-size='13' text-anchor='start' font-weight='bold' fill='#212121'>TX</text><circle cx='690' cy='200' r='5' fill='#fff' stroke='#37474f' stroke-width='2'/><text x='704' y='204.5' font-size='13' text-anchor='start' font-weight='bold' fill='#212121'>RX</text><circle cx='690' cy='234' r='5' fill='#fff' stroke='#37474f' stroke-width='2'/><text x='704' y='238.5' font-size='13' text-anchor='start' font-weight='bold' fill='#212121'>GND</text><circle cx='690' cy='268' r='5' fill='#fff' stroke='#37474f' stroke-width='2'/><text x='704' y='272.5' font-size='13' text-anchor='start' font-weight='bold' fill='#212121'>+5V</text><text x='678' y='204.5' font-size='11' text-anchor='end' font-weight='normal' fill='#9e9e9e' font-style='italic'>not connected</text><circle cx='920' cy='176' r='5' fill='#fff' stroke='#37474f' stroke-width='2'/><circle cx='920' cy='228' r='5' fill='#fff' stroke='#37474f' stroke-width='2'/><text x='908' y='180' font-size='11' text-anchor='end' font-weight='normal' fill='#455a64'>ANT</text><polyline points='920,176 950,176' fill='none' stroke='#8d6e63' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/><polyline points='920,228 950,228' fill='none' stroke='#8d6e63' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/><ellipse cx='962' cy='202.0' rx='14' ry='34.0' fill='none' stroke='#8d6e63' stroke-width='5'/><text x='962' y='262' font-size='11' text-anchor='middle' font-weight='normal' fill='#455a64'>coil</text><polyline points='280,166 440,166' fill='none' stroke='#00897b' stroke-width='3' stroke-linejoin='round' stroke-linecap='round'/><circle cx='440' cy='166' r='4.5' fill='#00897b'/><polyline points='440,166 490,166' fill='none' stroke='#00897b' stroke-width='3' stroke-linejoin='round' stroke-linecap='round'/><polyline points='490,166 495.0,173 505.0,159 515.0,173 525.0,159 535.0,173 545.0,159 550,166' fill='none' stroke='#00897b' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/><text x='520' y='153' font-size='12' text-anchor='middle' font-weight='bold' fill='#212121'>R1 1 kΩ</text><polyline points='550,166 690,166' fill='none' stroke='#00897b' stroke-width='3' stroke-linejoin='round' stroke-linecap='round'/><polyline points='440,166 440,180' fill='none' stroke='#00897b' stroke-width='3' stroke-linejoin='round' stroke-linecap='round'/><polyline points='440,180 447,185.0 433,195.0 447,205.0 433,215.0 447,225.0 433,235.0 440,240' fill='none' stroke='#00897b' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/><text x='454' y='214' font-size='12' text-anchor='start' font-weight='bold' fill='#212121'>R2 2 kΩ</text><polyline points='440,240 440,250' fill='none' stroke='#212121' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/><polyline points='440,250 440,260' fill='none' stroke='#212121' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/><polyline points='426,260 454,260' fill='none' stroke='#212121' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/><polyline points='431,265 449,265' fill='none' stroke='#212121' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/><polyline points='436,270 444,270' fill='none' stroke='#212121' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/><text x='380' y='156' font-size='11' text-anchor='middle' font-weight='normal' fill='#455a64' font-style='italic'>5 V → 3.3 V</text><polyline points='690,234 650,234 650,240' fill='none' stroke='#212121' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/><polyline points='650,240 650,250' fill='none' stroke='#212121' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/><polyline points='636,250 664,250' fill='none' stroke='#212121' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/><polyline points='641,255 659,255' fill='none' stroke='#212121' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/><polyline points='646,260 654,260' fill='none' stroke='#212121' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/><rect x='340' y='338' width='150' height='92' rx='8' fill='#fce4ec' stroke='#37474f' stroke-width='2'/><text x='415' y='360' font-size='14' text-anchor='middle' font-weight='bold' fill='#212121'>Boost 5 V</text><text x='415' y='378' font-size='11' text-anchor='middle' font-weight='normal' fill='#455a64'>MT3608, set to 5.0 V</text><text x='350' y='404' font-size='12' text-anchor='start' font-weight='bold' fill='#212121'>IN+</text><text x='350' y='422' font-size='12' text-anchor='start' font-weight='bold' fill='#212121'>IN−</text><text x='480' y='404' font-size='12' text-anchor='end' font-weight='bold' fill='#212121'>OUT+</text><text x='480' y='422' font-size='12' text-anchor='end' font-weight='bold' fill='#212121'>OUT−</text><polyline points='280,400 340,400' fill='none' stroke='#e53935' stroke-width='3' stroke-linejoin='round' stroke-linecap='round'/><polyline points='280,418 340,418' fill='none' stroke='#212121' stroke-width='3' stroke-linejoin='round' stroke-linecap='round'/><polyline points='490,418 502,418 502,442' fill='none' stroke='#212121' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/><polyline points='502,442 502,452' fill='none' stroke='#212121' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/><polyline points='488,452 516,452' fill='none' stroke='#212121' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/><polyline points='493,457 511,457' fill='none' stroke='#212121' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/><polyline points='498,462 506,462' fill='none' stroke='#212121' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/><polyline points='490,400 620,400 620,268 690,268' fill='none' stroke='#ad1457' stroke-width='3' stroke-linejoin='round' stroke-linecap='round'/><text x='628' y='338.0' font-size='12' text-anchor='start' font-weight='bold' fill='#ad1457'>5 V</text><rect x='30' y='96' width='250' height='382' rx='10' fill='#e8f5e9' stroke='#37474f' stroke-width='2'/><text x='155.0' y='122' font-size='15' text-anchor='middle' font-weight='bold' fill='#212121'>Waveshare ESP32-C5</text><text x='155.0' y='140' font-size='11.5' text-anchor='middle' font-weight='normal' fill='#455a64'>WIFI6-KIT (header pins)</text><circle cx='280' cy='166' r='5' fill='#fff' stroke='#37474f' stroke-width='2'/><text x='266' y='170.5' font-size='13' text-anchor='end' font-weight='bold' fill='#00897b'>GPIO 4</text><circle cx='280' cy='400' r='5' fill='#fff' stroke='#37474f' stroke-width='2'/><text x='266' y='404.5' font-size='13' text-anchor='end' font-weight='bold' fill='#e53935'>3V3</text><circle cx='280' cy='418' r='5' fill='#fff' stroke='#37474f' stroke-width='2'/><text x='266' y='422.5' font-size='13' text-anchor='end' font-weight='bold' fill='#212121'>GND</text><polyline points='30,508 56,508' fill='none' stroke='#e53935' stroke-width='4' stroke-linejoin='round' stroke-linecap='round'/><text x='62' y='512.5' font-size='12' text-anchor='start' font-weight='normal' fill='#212121'>3V3</text><polyline points='116,508 142,508' fill='none' stroke='#212121' stroke-width='4' stroke-linejoin='round' stroke-linecap='round'/><text x='148' y='512.5' font-size='12' text-anchor='start' font-weight='normal' fill='#212121'>GND</text><polyline points='202,508 228,508' fill='none' stroke='#ad1457' stroke-width='4' stroke-linejoin='round' stroke-linecap='round'/><text x='234' y='512.5' font-size='12' text-anchor='start' font-weight='normal' fill='#212121'>5V</text><polyline points='280,508 306,508' fill='none' stroke='#00897b' stroke-width='4' stroke-linejoin='round' stroke-linecap='round'/><text x='312' y='512.5' font-size='12' text-anchor='start' font-weight='normal' fill='#212121'>RDM TX</text><text x='30' y='552' font-size='14' text-anchor='start' font-weight='bold' fill='#212121'>Notes / Catatan</text><text x='30' y='574' font-size='12.5' text-anchor='start' font-weight='normal' fill='#212121'>• RDM6300 needs 5 V. Its TX is 5 V: R1/R2 bring it down to 3.3 V for GPIO 4.</text><text x='42' y='591' font-size='12' text-anchor='start' font-weight='normal' fill='#546e7a' font-style='italic'>RDM6300 butuh 5 V. TX-nya 5 V: R1/R2 menurunkannya ke 3,3 V untuk GPIO 4.</text><text x='30' y='614' font-size='12.5' text-anchor='start' font-weight='normal' fill='#212121'>• Set the MT3608 to 5.0 V before connecting. A reader always on USB may use the board 5V pin instead.</text><text x='42' y='631' font-size='12' text-anchor='start' font-weight='normal' fill='#546e7a' font-style='italic'>Atur MT3608 ke 5,0 V sebelum disambung. Reader yang selalu pakai USB boleh ambil dari pin 5V board.</text><text x='30' y='654' font-size='12.5' text-anchor='start' font-weight='normal' fill='#212121'>• ⏚ and 3V3 labels connect to the board GND and 3V3 pins.</text><text x='42' y='671' font-size='12' text-anchor='start' font-weight='normal' fill='#546e7a' font-style='italic'>Label ⏚ dan 3V3 disambung ke pin GND dan 3V3 board.</text><text x='30' y='694' font-size='12.5' text-anchor='start' font-weight='normal' fill='#212121'>• LED, buzzer, battery and INA219 wiring stays as in docs/PLAN.md §1.2.</text><text x='42' y='711' font-size='12' text-anchor='start' font-weight='normal' fill='#546e7a' font-style='italic'>Wiring LED, buzzer, baterai, dan INA219 tetap seperti docs/PLAN.id.md §1.2.</text></svg>