<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 628' width='1000' height='628' font-family='system-ui, -apple-system, Segoe UI, Roboto, sans-serif'><title>Gapura wiring: RC522</title><rect width='1000' height='628' fill='#ffffff'/><text x='30' y='38' font-size='22' text-anchor='start' font-weight='bold' fill='#212121'>Gapura wiring · RC522</text><text x='30' y='60' font-size='13' text-anchor='start' font-weight='normal' fill='#455a64'>Dashboard → Settings → Card reader: “rc522”, then restart.</text><text x='30' y='77' font-size='12' text-anchor='start' font-weight='normal' fill='#78909c' font-style='italic'>Dashboard → Settings → Card reader: pilih “rc522”, lalu restart.</text><rect x='690' y='104' width='230' height='322' rx='10' fill='#e3f2fd' stroke='#37474f' stroke-width='2'/><text x='805.0' y='126' font-size='15' text-anchor='middle' font-weight='bold' fill='#212121'>RC522 module</text><text x='805.0' y='143' font-size='11.5' text-anchor='middle' font-weight='normal' fill='#455a64'>13.56 MHz · 3.3 V only</text><circle cx='690' cy='166' r='5' fill='#fff' stroke='#37474f' stroke-width='2'/><text x='704' y='170.5' font-size='13' text-anchor='start' font-weight='bold' fill='#212121'>SDA</text><polyline points='280,166 690,166' fill='none' stroke='#ef6c00' stroke-width='3' stroke-linejoin='round' stroke-linecap='round'/><circle cx='690' cy='200' r='5' fill='#fff' stroke='#37474f' stroke-width='2'/><text x='704' y='204.5' font-size='13' text-anchor='start' font-weight='bold' fill='#212121'>SCK</text><polyline points='280,200 690,200' fill='none' stroke='#f9a825' stroke-width='3' stroke-linejoin='round' stroke-linecap='round'/><circle cx='690' cy='234' r='5' fill='#fff' stroke='#37474f' stroke-width='2'/><text x='704' y='238.5' font-size='13' text-anchor='start' font-weight='bold' fill='#212121'>MOSI</text><polyline points='280,234 690,234' fill='none' stroke='#1e88e5' stroke-width='3' stroke-linejoin='round' stroke-linecap='round'/><circle cx='690' cy='268' r='5' fill='#fff' stroke='#37474f' stroke-width='2'/><text x='704' y='272.5' font-size='13' text-anchor='start' font-weight='bold' fill='#212121'>MISO</text><polyline points='280,268 690,268' fill='none' stroke='#43a047' stroke-width='3' stroke-linejoin='round' stroke-linecap='round'/><circle cx='690' cy='302' r='5' fill='#fff' stroke='#37474f' stroke-width='2'/><text x='704' y='306.5' font-size='13' text-anchor='start' font-weight='bold' fill='#212121'>IRQ</text><text x='678' y='306.5' font-size='11' text-anchor='end' font-weight='normal' fill='#9e9e9e' font-style='italic'>not connected</text><circle cx='690' cy='336' r='5' fill='#fff' stroke='#37474f' stroke-width='2'/><text x='704' y='340.5' font-size='13' text-anchor='start' font-weight='bold' fill='#212121'>GND</text><polyline points='280,336 690,336' fill='none' stroke='#212121' stroke-width='3' stroke-linejoin='round' stroke-linecap='round'/><circle cx='690' cy='370' r='5' fill='#fff' stroke='#37474f' stroke-width='2'/><text x='704' y='374.5' font-size='13' text-anchor='start' font-weight='bold' fill='#212121'>RST</text><polyline points='280,370 690,370' fill='none' stroke='#6d4c41' stroke-width='3' stroke-linejoin='round' stroke-linecap='round'/><circle cx='690' cy='404' r='5' fill='#fff' stroke='#37474f' stroke-width='2'/><text x='704' y='408.5' font-size='13' text-anchor='start' font-weight='bold' fill='#212121'>3.3V</text><polyline points='280,404 690,404' fill='none' stroke='#e53935' stroke-width='3' stroke-linejoin='round' stroke-linecap='round'/><rect x='30' y='96' width='250' height='346' rx='10' fill='#e8f5e9' stroke='#37474f' stroke-width='2'/><text x='155.0' y='122' font-size='15' text-anchor='middle' font-weight='bold' fill='#212121'>Waveshare ESP32-C5</text><text x='155.0' y='140' font-size='11.5' text-anchor='middle' font-weight='normal' fill='#455a64'>WIFI6-KIT (header pins)</text><circle cx='280' cy='166' r='5' fill='#fff' stroke='#37474f' stroke-width='2'/><text x='266' y='170.5' font-size='13' text-anchor='end' font-weight='bold' fill='#ef6c00'>GPIO 23</text><circle cx='280' cy='200' r='5' fill='#fff' stroke='#37474f' stroke-width='2'/><text x='266' y='204.5' font-size='13' text-anchor='end' font-weight='bold' fill='#f9a825'>GPIO 10</text><circle cx='280' cy='234' r='5' fill='#fff' stroke='#37474f' stroke-width='2'/><text x='266' y='238.5' font-size='13' text-anchor='end' font-weight='bold' fill='#1e88e5'>GPIO 8</text><circle cx='280' cy='268' r='5' fill='#fff' stroke='#37474f' stroke-width='2'/><text x='266' y='272.5' font-size='13' text-anchor='end' font-weight='bold' fill='#43a047'>GPIO 9</text><circle cx='280' cy='336' r='5' fill='#fff' stroke='#37474f' stroke-width='2'/><text x='266' y='340.5' font-size='13' text-anchor='end' font-weight='bold' fill='#212121'>GND</text><circle cx='280' cy='370' r='5' fill='#fff' stroke='#37474f' stroke-width='2'/><text x='266' y='374.5' font-size='13' text-anchor='end' font-weight='bold' fill='#6d4c41'>GPIO 24</text><circle cx='280' cy='404' r='5' fill='#fff' stroke='#37474f' stroke-width='2'/><text x='266' y='408.5' font-size='13' text-anchor='end' font-weight='bold' fill='#e53935'>3V3</text><polyline points='30,472 56,472' fill='none' stroke='#e53935' stroke-width='4' stroke-linejoin='round' stroke-linecap='round'/><text x='62' y='476.5' font-size='12' text-anchor='start' font-weight='normal' fill='#212121'>3V3</text><polyline points='116,472 142,472' fill='none' stroke='#212121' stroke-width='4' stroke-linejoin='round' stroke-linecap='round'/><text x='148' y='476.5' font-size='12' text-anchor='start' font-weight='normal' fill='#212121'>GND</text><polyline points='202,472 228,472' fill='none' stroke='#ef6c00' stroke-width='4' stroke-linejoin='round' stroke-linecap='round'/><text x='234' y='476.5' font-size='12' text-anchor='start' font-weight='normal' fill='#212121'>SS</text><polyline points='280,472 306,472' fill='none' stroke='#f9a825' stroke-width='4' stroke-linejoin='round' stroke-linecap='round'/><text x='312' y='476.5' font-size='12' text-anchor='start' font-weight='normal' fill='#212121'>SCK</text><polyline points='366,472 392,472' fill='none' stroke='#1e88e5' stroke-width='4' stroke-linejoin='round' stroke-linecap='round'/><text x='398' y='476.5' font-size='12' text-anchor='start' font-weight='normal' fill='#212121'>MOSI</text><polyline points='460,472 486,472' fill='none' stroke='#43a047' stroke-width='4' stroke-linejoin='round' stroke-linecap='round'/><text x='492' y='476.5' font-size='12' text-anchor='start' font-weight='normal' fill='#212121'>MISO</text><polyline points='554,472 580,472' fill='none' stroke='#6d4c41' stroke-width='4' stroke-linejoin='round' stroke-linecap='round'/><text x='586' y='476.5' font-size='12' text-anchor='start' font-weight='normal' fill='#212121'>RST</text><text x='30' y='516' font-size='14' text-anchor='start' font-weight='bold' fill='#212121'>Notes / Catatan</text><text x='30' y='538' font-size='12.5' text-anchor='start' font-weight='normal' fill='#212121'>• RC522 and PN532 run on 3.3 V only from the board 3V3 pin. Fit one of them, not both.</text><text x='42' y='555' font-size='12' text-anchor='start' font-weight='normal' fill='#546e7a' font-style='italic'>RC522 dan PN532 pakai 3,3 V dari pin 3V3 board. Pasang salah satu saja.</text><text x='30' y='578' font-size='12.5' text-anchor='start' font-weight='normal' fill='#212121'>• LED, buzzer, battery and INA219 wiring stays as in docs/PLAN.md §1.2.</text><text x='42' y='595' font-size='12' text-anchor='start' font-weight='normal' fill='#546e7a' font-style='italic'>Wiring LED, buzzer, baterai, dan INA219 tetap seperti docs/PLAN.id.md §1.2.</text></svg>