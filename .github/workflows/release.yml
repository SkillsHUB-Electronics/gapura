name: Release

# Pushing a tag like v0.2.0, or publishing a release on GitHub, builds the
# firmware and the dashboard file system image and attaches them to the
# release (created with generated notes when it does not exist yet).
# Pull requests that touch this file run the build only, so the workflow is
# checked before the next tag.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  pull_request:
    paths: [.github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            firmware/.pio/libdeps
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio

      - name: Build dashboard into firmware/data
        working-directory: dashboard
        run: npm ci && npm run build

      - name: Build firmware and LittleFS image
        working-directory: firmware
        run: |
          pio run -e esp32c5
          pio run -e esp32c5 -t buildfs

      - name: Collect release files
        run: |
          mkdir -p dist
          b=firmware/.pio/build/esp32c5
          cp $b/firmware.bin $b/bootloader.bin $b/partitions.bin $b/littlefs.bin dist/
          (cd dist && sha256sum *.bin > SHA256SUMS.txt)
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: gapura-release
          path: dist/

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: gapura-release
          path: dist
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gapura $TAG" \
            --generate-notes \
            --notes "Flash \`firmware.bin\` over USB or OTA, and \`littlefs.bin\` for the dashboard. See CHANGELOG.md for details."
