name: Feature request
description: Suggest an idea or an improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Check docs/PLAN.md section 4.1 first: your idea may already be planned.

  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
      description: Describe the situation, not only the solution.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How could Gapura solve it? Mention protocol commands, dashboard screens or hardware if relevant.

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Firmware
        - Dashboard
        - Protocol
        - Hardware / wiring
        - Documentation
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
